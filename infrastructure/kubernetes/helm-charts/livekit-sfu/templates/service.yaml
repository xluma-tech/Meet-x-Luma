apiVersion: v1
kind: Service
metadata:
  name: {{ include "livekit-sfu.fullname" . }}
  labels:
    {{- include "livekit-sfu.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  externalTrafficPolicy: Local
  {{- end }}
  ports:
    - port: {{ .Values.service.ports.http.port }}
      targetPort: {{ .Values.service.ports.http.targetPort }}
      protocol: {{ .Values.service.ports.http.protocol }}
      name: http
    - port: {{ .Values.service.ports.rtc-tcp.port }}
      targetPort: {{ .Values.service.ports.rtc-tcp.targetPort }}
      protocol: {{ .Values.service.ports.rtc-tcp.protocol }}
      name: rtc-tcp
    - port: {{ .Values.service.ports.rtc-udp-start.port }}
      targetPort: {{ .Values.service.ports.rtc-udp-start.targetPort }}
      protocol: {{ .Values.service.ports.rtc-udp-start.protocol }}
      name: rtc-udp
    - port: {{ .Values.service.ports.metrics.port }}
      targetPort: {{ .Values.service.ports.metrics.targetPort }}
      protocol: {{ .Values.service.ports.metrics.protocol }}
      name: metrics
  selector:
    {{- include "livekit-sfu.selectorLabels" . | nindent 4 }}
